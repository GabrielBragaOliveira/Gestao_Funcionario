<p-toast></p-toast>
<p-confirmDialog [style]="{width: '50vw'}"></p-confirmDialog>

<div class="card p-4 shadow-lg rounded-lg max-w-7xl mx-auto">
  <h2 class="text-2xl font-bold mb-4">Sistema de Gestão de Departamentos</h2>

  <div class="flex flex-col md:flex-row items-center gap-3 mb-4">
    <div class="flex gap-2 ml-auto w-full md:w-auto">
      <p-button icon="pi pi-plus" label="Novo" (onClick)="novoDepartamento()" styleClass="p-button-success"></p-button>
      <p-button icon="pi pi-refresh" label="Recarregar" (onClick)="listarTodos()" styleClass="p-button-info"></p-button>
    </div>
  </div>

  <div *ngIf="carregando" class="flex justify-center items-center h-40">
    <i class="pi pi-spin pi-spinner text-4xl text-blue-500"></i>
    <span class="ml-3 text-lg"> Carregando dados...</span>
  </div>

  <p-table [value]="departamentos" [paginator]="true" [rows]="10" [tableStyle]="{'min-width': '50rem'}"
           *ngIf="!carregando">
    <ng-template pTemplate="header">
      <tr>
        <th>Nome</th>
        <th>Sigla</th>
        <th>Status</th>
        <th style="width: 20%">Ações</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-dep>
      <tr>
        <td>{{ dep.nome }}</td>
        <td>{{ dep.sigla }}</td>
        <td>
          <p-tag [value]="dep.ativo ? 'Ativo' : 'Inativo'" [severity]="dep.ativo ? 'success' : 'danger'"></p-tag>
        </td>
        <td class="flex gap-2">
          <p-button icon="pi pi-pencil" pTooltip="Editar" tooltipPosition="top"
                    (onClick)="editar(dep)" styleClass="p-button-sm p-button-secondary"></p-button>

          <p-button icon="pi pi-ban" pTooltip="Inativar" tooltipPosition="top"
                    styleClass="p-button-danger p-button-sm" [disabled]="!dep.ativo"
                    (onClick)="inativar(dep)">
          </p-button>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="text-center py-4">Nenhum departamento encontrado.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="Departamento" [(visible)]="mostrarForm" [modal]="true" [closable]="false">
  <app-departamento-form [departamentoParaEditar]="departamentoParaEditar"></app-departamento-form>
  <p-footer>
    <p-button label="Fechar" (click)="fecharForm()" styleClass="p-button-secondary"></p-button>
  </p-footer>
</p-dialog>
