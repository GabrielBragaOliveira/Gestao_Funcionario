<p-toast></p-toast>

<div class="card p-4 shadow-lg rounded-lg max-w-lg mx-auto">
  <h2 class="text-2xl font-bold mb-6 text-center">{{ pageTitle }}</h2>

  <form [formGroup]="funcionarioForm" (ngSubmit)="onSubmit()" class="p-fluid">

    <!-- Nome, Email, Cargo ... -->

    <!-- Dropdown Departamento -->
    <div class="field mb-4">
      <label for="departamento" class="font-semibold block mb-2">Departamento</label>
      <p-dropdown 
        id="departamento"
        [options]="departamentos"
        optionLabel="nome"
        formControlName="departamento"
        placeholder="Selecione um departamento"
        [class.ng-invalid]="f['departamento'].invalid && f['departamento'].touched">
      </p-dropdown>
      <small class="p-error block mt-1" *ngIf="f['departamento'].invalid && f['departamento'].touched">
        <span>O departamento é obrigatório.</span>
      </small>
    </div>

    <!-- Salário, Data de Admissão ... -->

    <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
      <button type="button" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
      <p-button type="submit" [label]="isEditMode ? 'Atualizar' : 'Salvar'" [disabled]="funcionarioForm.invalid || funcionarioForm.disabled"></p-button>
    </div>

  </form>
</div>
